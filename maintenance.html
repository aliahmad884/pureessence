  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;

      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f9f9f9;
      text-align: center;
      color: #333;
    }

    img {

    }

    }

      margin: 0 10px;

      color: #fff;
      border-radius: 5px;

    }
